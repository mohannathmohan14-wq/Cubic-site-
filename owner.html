#root{position:relative;z-index:1}
.hero{background:radial-gradient(58% 66% at 74% 42%,rgba(96,52,190,.14),transparent 70%)}
.hero-main{min-height:650px;padding:72px 0 46px}
.hero h1{font-size:clamp(44px,4.9vw,70px);letter-spacing:-.028em;line-height:1.05;font-weight:600}
.hero-line{white-space:normal}
html[lang=hi] .hero h1{letter-spacing:0;font-size:clamp(38px,4.3vw,60px)}
.hero-eyebrow{text-transform:uppercase;letter-spacing:1.6px}
.hero-description{font-size:16.5px;letter-spacing:.01em}
.hero-buttons .text-link{border:1px solid var(--border-strong);padding:12px 22px;border-radius:999px;background:rgba(24,14,44,.42);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);font-size:10.5px;letter-spacing:.06em;transition:border-color .45s ease,background-color .45s ease,transform .45s ease}
.hero-buttons .text-link:hover{border-color:rgba(188,166,255,.5);background:rgba(38,22,70,.55);transform:translateY(-1px)}
.hero-art{top:4px;right:-26px;width:57%;height:650px;perspective:1300px}
.hero-art:before{width:70%;height:74%;top:6%;left:16%;background:radial-gradient(ellipse,rgba(139,92,246,.22),transparent 72%);filter:blur(34px)}
.art-grid{opacity:.14}
.jelly-stage{position:absolute;inset:0;transform-style:preserve-3d}
.sculpture-float.jelly-float{animation:jelly-float 15s ease-in-out infinite}
@keyframes jelly-float{0%,to{transform:translateY(0)}50%{transform:translateY(-18px)}}
.hero-sculpture.hero-jelly{width:auto;height:100%;max-width:100%;mix-blend-mode:screen;opacity:.94;filter:brightness(1.05) saturate(1.06) drop-shadow(0 30px 90px rgba(103,58,210,.35));transform:translateZ(8px);animation:tentacle-sway 8.5s ease-in-out infinite}
@keyframes tentacle-sway{0%,to{transform:translateZ(8px) rotate(-1deg)}50%{transform:translateZ(8px) rotate(1deg)}}
.hero-cards{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d}
.glass-card{position:absolute;pointer-events:auto;width:214px;padding:16px 18px 14px;border-radius:18px;background:linear-gradient(155deg,rgba(36,21,68,.74),rgba(13,7,27,.68));border:1px solid rgba(186,164,255,.17);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 30px 70px rgba(4,1,12,.55),inset 0 1px 0 rgba(216,202,255,.14);font-size:10.5px;line-height:1.5;color:var(--text);transition:border-color .5s ease,box-shadow .5s ease}
.glass-card:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(118deg,rgba(255,255,255,.08),transparent 30%,transparent 68%,rgba(255,255,255,.04))}
.glass-card:hover{border-color:rgba(198,178,255,.42);box-shadow:0 34px 84px rgba(4,1,12,.66),0 0 42px rgba(139,92,246,.14),inset 0 1px 0 rgba(216,202,255,.2)}
.glass-card-top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.glass-card-index{font-size:8.5px;letter-spacing:.16em;color:var(--accent);opacity:.95}
.glass-card h3{font-family:var(--heading);font-size:19px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.05;margin:0}
.glass-card-value{font-family:var(--heading);font-size:26px;letter-spacing:.03em;line-height:1.1}
.glass-card-list{list-style:none;margin:0;padding:0}
.glass-card-list li{padding:5px 0 4px;border-top:1px solid rgba(186,164,255,.12);color:var(--muted);font-size:10px;letter-spacing:.03em}
.glass-card-list li:first-child{border-top:0;padding-top:0}
.glass-stat{display:flex;align-items:baseline;gap:9px}
.glass-stat strong{font-family:var(--heading);font-size:22px;font-weight:600;color:var(--accent);letter-spacing:.02em}
@keyframes card-bob{0%,to{translate:0 0}50%{translate:0 -12px}}
.glass-card-1{left:-3%;top:4%;transform:translateZ(44px) rotate(-2.4deg);animation:card-bob 13s ease-in-out infinite}
.glass-card-2{right:-7%;top:30%;transform:translateZ(26px) rotate(1.8deg);animation:card-bob 17s ease-in-out infinite;animation-delay:-5s}
.glass-card-3{left:4%;bottom:-3%;transform:translateZ(12px) rotate(-1.2deg);animation:card-bob 21s ease-in-out infinite;animation-delay:-9s;filter:blur(.4px);opacity:.97}
.glass-card-stats{right:0;bottom:3%;width:232px;transform:translateZ(34px) rotate(1.4deg);animation:card-bob 19s ease-in-out infinite;animation-delay:-13s}
html[data-theme=light] .glass-card{background:linear-gradient(155deg,rgba(255,255,255,.78),rgba(233,226,248,.7));border-color:rgba(94,64,180,.18)}
@media (max-width:1120px){.hero h1{font-size:clamp(40px,6vw,56px)}.glass-card{width:192px}}
@media (max-width:920px){.hero-main{min-height:0;padding:50px 0 26px}.hero-copy{width:100%}.hero-art{position:relative;top:auto;right:auto;left:-22px;width:calc(100% + 44px);height:450px;z-index:0;pointer-events:none}.hero-sculpture.hero-jelly{height:90%;opacity:.78}.glass-card-3{display:none}.glass-card{pointer-events:none;width:178px}.glass-card-1{left:4%;top:6%}.glass-card-2{right:2%;top:44%}.dimension-tag{display:none}}
@media (max-width:620px){.hero h1{font-size:clamp(31px,8.6vw,44px)}.hero-buttons{flex-wrap:wrap;gap:14px}.hero-buttons .button{min-width:0;flex:1 1 46%;min-height:50px;justify-content:center}.hero-art{height:330px}.glass-card-2{display:none}.delivery-badge{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){.sculpture-float.jelly-float,.hero-sculpture.hero-jelly,.glass-card,body::before{animation:none!important}.hero-buttons .text-link{transition:none}}

.hero-sculpture.hero-jelly{-webkit-mask-image:radial-gradient(ellipse 63% 55% at 50% 42%,#000 38%,transparent 72%);mask-image:radial-gradient(ellipse 63% 55% at 50% 42%,#000 38%,transparent 72%)}
.glass-card-1{left:2%}
@media (max-width:920px){.hero-sculpture.hero-jelly{-webkit-mask-image:radial-gradient(ellipse 72% 66% at 50% 42%,#000 52%,transparent 82%);mask-image:radial-gradient(ellipse 72% 66% at 50% 42%,#000 52%,transparent 82%)}}

.hero h1{text-wrap:balance}
html[data-theme=light] .hero-sculpture.hero-jelly{opacity:.88;filter:brightness(1.12) saturate(1.08) drop-shadow(0 18px 60px rgba(91,63,196,.22))}
.glass-card-3{bottom:3%}

/* ===== Enquiry form — violet glass workbench (highlight + differentiation) ===== */
#main-content .contact-section{position:relative}
#main-content .contact-section:before{content:"";position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:min(900px,94vw);height:560px;background:radial-gradient(52% 60% at 64% 40%,rgba(124,70,238,.2),transparent 72%);filter:blur(10px);pointer-events:none;z-index:0}
#main-content .contact-layout{position:relative;z-index:1}
#main-content .contact-form-card{position:relative;background:linear-gradient(168deg,rgba(33,18,64,.78),rgba(11,5,22,.72));border:1px solid rgba(183,161,255,.3);border-radius:24px;padding:26px 28px 22px;box-shadow:0 44px 120px rgba(3,0,12,.62),0 0 60px rgba(124,70,238,.1),inset 0 1px 0 rgba(222,208,255,.16);backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35)}
#main-content .contact-form-card:before{content:"";position:absolute;left:9%;right:9%;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(206,190,255,.9),transparent);animation:enq-hair 6.5s ease-in-out infinite}
@keyframes enq-hair{0%,to{opacity:.45}50%{opacity:1}}
#main-content .contact-form-card .form-progress{border-bottom:1px solid rgba(183,161,255,.14)}
#main-content .contact-form-card .form-progress>div>button{border:1px solid transparent;border-radius:999px;padding:7px 13px;letter-spacing:.08em;text-transform:uppercase;font-size:8px;color:var(--subtle);transition:color .35s ease,border-color .35s ease,background-color .35s ease,box-shadow .35s ease}
#main-content .contact-form-card .form-progress>div>button:hover:not(:disabled){color:var(--text)}
#main-content .contact-form-card .form-progress>div>button.active{color:var(--text);background:rgba(124,70,238,.17);border-color:rgba(198,178,255,.42);box-shadow:0 6px 24px rgba(124,70,238,.22)}
#main-content .contact-form-card .form-progress>div>button.complete{color:var(--accent);border-color:rgba(183,161,255,.24)}
#main-content .contact-form-card .form-step .field label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
#main-content .contact-form-card .form-step .field input,#main-content .contact-form-card .form-step .field textarea,#main-content .contact-form-card .form-step .field select{background:rgba(8,4,16,.5);border:1px solid rgba(183,161,255,.15);border-radius:12px;padding:12px 14px;font-size:12.5px;letter-spacing:.01em;transition:border-color .35s ease,box-shadow .35s ease,background-color .35s ease}
#main-content .contact-form-card .form-step .field input:focus,#main-content .contact-form-card .form-step .field textarea:focus,#main-content .contact-form-card .form-step .field select:focus{border-color:rgba(206,188,255,.6);background:rgba(14,7,28,.72);box-shadow:0 0 0 4px rgba(124,70,238,.16),0 0 30px rgba(124,70,238,.14)}
#main-content .contact-form-card .project-type{border:1px solid rgba(183,161,255,.13);background:rgba(8,4,16,.4);border-radius:14px;transition:border-color .35s ease,background-color .35s ease,box-shadow .35s ease}
#main-content .contact-form-card .project-type:hover{border-color:rgba(198,178,255,.4)}
#main-content .contact-form-card .budget-option{border:1px solid rgba(183,161,255,.13);background:rgba(8,4,16,.4);border-radius:14px;transition:border-color .35s ease,background-color .35s ease,box-shadow .35s ease}
#main-content .contact-form-card .budget-option:hover{border-color:rgba(198,178,255,.4)}
#main-content .contact-form-card .budget-option.selected,#main-content .contact-form-card .project-type.selected{border-color:var(--accent);background:linear-gradient(150deg,rgba(124,70,238,.22),rgba(124,70,238,.07));box-shadow:0 10px 34px rgba(124,70,238,.2)}
#main-content .contact-form-card .button-primary{background:linear-gradient(135deg,#8B5CF6,#5B21B6);border:0;color:#F6F2FF;box-shadow:0 18px 46px rgba(109,58,220,.38),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .35s ease,box-shadow .35s ease,filter .35s ease}
#main-content .contact-form-card .button-primary:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 24px 60px rgba(109,58,220,.5),inset 0 1px 0 rgba(255,255,255,.22)}
#main-content .contact-availability .status-dot{background:var(--accent);animation:enq-pulse 3s ease-in-out infinite}
@keyframes enq-pulse{0%,to{box-shadow:0 0 0 0 rgba(188,166,255,.35)}50%{box-shadow:0 0 0 6px rgba(188,166,255,0)}}
html[data-theme=light] #main-content .contact-form-card{background:linear-gradient(168deg,rgba(255,255,255,.94),rgba(238,232,250,.86));border-color:rgba(94,64,180,.28);box-shadow:0 30px 80px rgba(64,40,130,.18),inset 0 1px 0 rgba(255,255,255,.8)}
html[data-theme=light] #main-content .contact-form-card .form-step .field input,html[data-theme=light] #main-content .contact-form-card .form-step .field textarea,html[data-theme=light] #main-content .contact-form-card .form-step .field select{background:rgba(255,255,255,.72);border-color:rgba(94,64,180,.18)}
@media (prefers-reduced-motion:reduce){#main-content .contact-form-card:before,#main-content .contact-availability .status-dot{animation:none}#main-content .contact-form-card .button-primary{transition:none}}
</style>
